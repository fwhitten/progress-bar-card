name: Release

# Triggered by the tag rather than by the release, so a release is never
# published in a state where HACS (or a user) can see it without its bundle.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ha-progress-card.js --clobber
          else
            gh release create "$TAG" dist/ha-progress-card.js \
              --title "$TAG" --generate-notes
          fi
